(function(){

    const telegramBtn =
        document.getElementById('telegramBtn');

    const buttonText =
        document.getElementById('buttonText');


    /*
     * Prevent duplicate tracking.
     *
     * This protects against:
     * - double clicks
     * - rapid repeated clicks
     * - accidental duplicate events
     */

    let telegramClickTracked = false;


    /*
     * Generate a unique event ID.
     *
     * This ID can later be used with
     * Meta Conversions API for deduplication.
     */

    function generateEventId(){

        return 'tg_click_' +
            Date.now() +
            '_' +
            Math.random()
                .toString(36)
                .substring(2,10);
    }


    telegramBtn.addEventListener('click', function(event){

        /*
         * If already tracked during this page visit,
         * don't send another event.
         */

        if(telegramClickTracked){

            return;
        }


        telegramClickTracked = true;


        const eventId =
            generateEventId();


        /*
         * Store event ID locally.
         *
         * This helps prevent repeated
         * tracking during the same session.
         */

        try{

            sessionStorage.setItem(
                'telegram_event_id',
                eventId
            );

        }catch(error){}


        /*
         * IMPORTANT:
         *
         * Do NOT use:
         *
         * fbq('track','Subscribe')
         *
         * here.
         *
         * A button click is NOT proof that
         * the user joined Telegram.
         *
         * We track the click separately.
         */

        if(typeof fbq === 'function'){

            fbq(
                'track',
                'Lead',
                {
                    content_name: 'Telegram Join Click',
                    content_category: 'Telegram',
                    event_source: 'website'
                },
                {
                    eventID: eventId
                }
            );

        }


        /*
         * Change button temporarily so the user
         * gets visual feedback.
         */

        buttonText.textContent =
            'OPENING TELEGRAM...';


        /*
         * Disable repeated clicks.
         */

        telegramBtn.classList.add('disabled');


        /*
         * IMPORTANT:
         *
         * There is NO automatic redirect.
         *
         * The user's actual click opens Telegram
         * using the normal href.
         */

    });


})();
